syntax = "proto3";

package nexus.proto;

option csv_out_path = "nexus";

message FrameRequest {
  int64 frame_id = 1;
  uint64 timestamp_us = 2;
  int32 width = 3;
  int32 height = 4;
  int32 channels = 5;
  bytes image_data = 6;
}

message BoundingBox {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
  float confidence = 5;
  int32 class_id = 6;
}

message DetectionResult {
  int64 frame_id = 1;
  uint64 timestamp_us = 2;
  float end_to_end_latency_ms = 3;
  repeated BoundingBox boxes = 4;
}

service PerceptionEngine {
  rpc InferFrame (FrameRequest) returns (DetectionResult);
  rpc StreamFrames (stream FrameRequest) returns (stream DetectionResult);
}
